# The authentication API.
#
# Image: build and push from ./backend, then set it here or with
#   kubectl -n enterprise-auth set image deploy/backend backend=<ref>
#
# The database schema is owned by the migrate Job (04-migrate-job.yaml); this
# Deployment never runs alembic itself. An init container waits until Postgres
# and Redis accept connections, since Kubernetes has no depends_on.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: enterprise-auth
  labels:
    app.kubernetes.io/name: enterprise-auth
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: enterprise-auth
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: enterprise-auth
  labels:
    app.kubernetes.io/name: enterprise-auth
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: enterprise-auth
      app.kubernetes.io/component: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enterprise-auth
        app.kubernetes.io/component: backend
      annotations:
        # Rolls the pods when the shared configuration changes.
        checksum/config: placeholder # replaced by your CD tool if you use one
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: enterprise-auth
              app.kubernetes.io/component: backend
      initContainers:
        - name: wait-for-dependencies
          image: enterprise-auth/backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import socket, sys, time

              targets = [("$(POSTGRES_HOST)", 5432), ("$(REDIS_HOST)", 6379)]
              for _ in range(60):
                  pending = []
                  for host, port in targets:
                      try:
                          with socket.create_connection((host, port), timeout=2):
                              pass
                      except OSError:
                          pending.append(f"{host}:{port}")
                  if not pending:
                      sys.exit(0)
                  print("waiting for", ", ".join(pending), flush=True)
                  time.sleep(2)
              sys.exit("dependencies did not become reachable")
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef: { name: backend-config, key: POSTGRES_HOST }
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef: { name: backend-config, key: REDIS_HOST }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: backend
          image: enterprise-auth/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            # These are repeated before DATABASE_URL because Kubernetes only
            # expands $(VAR) from entries defined earlier in this same list,
            # never from envFrom sources.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD }
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef: { name: backend-config, key: POSTGRES_HOST }
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef: { name: backend-config, key: POSTGRES_PORT }
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: backend-config, key: POSTGRES_DB }
            - name: DATABASE_URL
              value: postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: app-secrets
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
