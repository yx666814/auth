# Served by nginx as a conf.d snippet: the surrounding http{} block (mime
# types, logging, temp paths) comes from the stock image's nginx.conf.

upstream auth_backend {
    # Compose service name; override with a k8s Service of the same name or
    # patch this file in a derived image.
    server backend:8000;
    keepalive 16;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health endpoint for the container / orchestrator probe. Kept off the
    # index so it never hits the SPA fallback.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- API proxy ---------------------------------------------------------
    # The browser only ever talks to this origin, so no CORS entry is needed
    # for the UI itself and the access token never crosses origins.
    location /api/ {
        proxy_pass http://auth_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Authentication responses must never be cached by a shared proxy.
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;

        # Strip any upstream cache hints that would let a browser reuse a
        # token response.
        add_header Cache-Control "no-store" always;
    }

    # ---- Static assets -----------------------------------------------------
    # Vite emits content-hashed filenames, so these can be cached forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- Security headers --------------------------------------------------
    # Applied to documents the SPA serves itself; API responses carry their
    # own headers from the backend middleware.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # index.html is the app shell: it must be revalidated on every load so a
    # deploy takes effect immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Client-side routes (/login, /account, /verify-email, ...) are all served
    # by the same document; anything without a file extension falls back to it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Do not leak the exact nginx build in the Server header.
    server_tokens off;
}
